# =============================================================================
# Fall Detection -- Caregiver Layer Helm Values
# Hetzner test deployment -- public connectivity test
# =============================================================================
# Purpose: test that the mobile app can reach the MQTT broker (WSS) and the
#          fall-dashboard (HTTPS) over the public internet from Hetzner.
# Domain:  company.smarkohealth.de (MCS-owned)
#   MQTT broker:    wss://mqtt.company.smarkohealth.de
#   fall-dashboard: https://fall.company.smarkohealth.de
#
# NOTE: certResolver must match the name configured in your Traefik
#       HelmChartConfig on this k3s node. Check with:
#         kubectl get helmchartconfig traefik -n kube-system -o yaml | grep certResolver
#       Common names: "le", "letsencrypt". Change both certResolver fields if needed.
# =============================================================================

namespace: fall-dashboard

# Pull from MCS private registry -- create the pull secret first:
#   kubectl create secret docker-registry mcs-labs \
#     --docker-server=registry.smarko-health.de \
#     --docker-username=<user> \
#     --docker-password=<pass> \
#     --namespace fall-dashboard
registry: registry.smarko-health.de
imagePullSecret: "mcs-labs"

# =============================================================================
# mosquitto MQTT broker
# =============================================================================
mosquitto:
  image: eclipse-mosquitto:2
  port: 1883
  wsPort: 9001
  # No NodePort needed -- Traefik IngressRoute handles external WSS on port 443
  wsNodePort: ""
  persistence:
    size: 500Mi
    storageClass: ""    # k3s default: local-path provisioner
  ingress:
    host: "fall-mqtt.smarko-health.de"
    certResolver: "le"    # verify name: kubectl get helmchartconfig traefik -n kube-system -o yaml
    # Live since 2026-06-22: TCP route + TLS 1.3 option (the HTTP IngressRoute
    # was replaced during debugging; see ai_docs/hetzner_mqtt_debug_log.md).
    tcp: true
    tlsMinVersion: "VersionTLS13"
  # Login files (passwd + acl) in Secret "mosquitto-auth", created by hand with
  # kubectl on 2026-10-28 and mounted at /mosquitto/secrets. Not managed by Helm;
  # users and steps: vault note "6G Tools info", section 7.
  authSecret: "mosquitto-auth"
  # Stage 1 (live since 2026-10-28): login files mounted but not active yet,
  # broker still anonymous. Stage 2 adds allow_anonymous false, password_file
  # and acl_file -- update this block in the same step.
  config: |
    per_listener_settings false
    allow_anonymous true
    max_packet_size 16384
    listener 1883
    listener 9001
    protocol websockets
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    log_type all

# =============================================================================
# fall-dashboard
# =============================================================================
fallDashboard:
  image: registry.smarko-health.de/fall-dashboard:latest
  imagePullPolicy: Always    # always pull from registry on Hetzner
  replicas: 1
  port: 8002
  # No NodePort needed -- Traefik IngressRoute handles external HTTPS on port 443
  httpNodePort: ""

  persistence:
    size: 500Mi
    storageClass: ""    # k3s default: local-path provisioner

  # Seed patient for testing -- add more from the dashboard UI after deploy
  patientIds: ""
  macIds: ""

  mqtt:
    alertTopic: fall/alert
    possibleTopic: fall/possible
    # Broker login, live since 2026-10-28 (user and ACL: vault note "6G Tools
    # info", section 7). The password is NOT stored here: pass it on every
    # helm upgrade, or the Secret gets an empty password and the dashboard
    # loses its broker connection once the broker requires logins:
    #   --set-string fallDashboard.mqtt.password=<fall-dashboard-python password>
    username: "fall-dashboard-python"
    password: ""

  influxdb:
    url: "http://influxdb-influxdb2.influxdb.svc.cluster.local:8086"    # NOTE: this is FOCUS cluster internal DNS -- not valid on Hetzner. Update to http://5.75.255.114:8086 if InfluxDB is on the Hetzner host, or confirm actual URL
    org: "focus"
    bucket: "sensors"          # verify against actual bucket name in InfluxDB UI
    fallEventsBucket: "sensors"
    # Dashboard writes fall_events itself, so counts work even when the mobile app
    # sends its data to FOKUS's InfluxDB instead of this one (2026-10-21)
    writeFallEvents: true
    token: "22fac594337ca38fe779460b0c23f7301abc6ab663141edee314cd824111b05e"

  ingress:
    host: "fall-dashboard.smarkohealth.de"    # NOTE: no DNS A record exists for this yet -- fall-dashboard accessible at http://5.75.255.114:8002 only
    certResolver: "le"    # verify name: kubectl get helmchartconfig traefik -n kube-system -o yaml
