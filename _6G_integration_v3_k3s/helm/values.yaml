# =============================================================================
# Fall Detection -- Caregiver Layer Helm Values
# =============================================================================
# Fill in every CHANGE_ME value before deploying.
# Sensitive values (influxdb.token) can also be passed at install time:
#   helm install caregiver helm/caregiver --set fallDashboard.influxdb.token=XXX
# NOTE: Kubernetes namespace names cannot contain underscores -- use hyphens.
# =============================================================================

namespace: fall-dashboard

# Container registry (FOCUS private registry + pull secret)
registry: registry-smarko-health.de
imagePullSecret: mcs-labs

# =============================================================================
# mosquitto MQTT broker
# =============================================================================
mosquitto:
  image: eclipse-mosquitto:2
  # Port mosquitto listens on inside the cluster (plain TCP -- TLS terminated by Traefik)
  port: 1883
  # Port exposed externally via Traefik TCP IngressRouteTCP (mobile app connects here)
  externalPort: 8883
  persistence:
    size: 500Mi
    storageClass: ""    # blank = use k3s cluster default (local-path provisioner)
  # Full mosquitto.conf content injected as a ConfigMap.
  # allow_anonymous must stay true unless you configure password_file auth below.
  config: |
    listener 1883
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    log_type all

# =============================================================================
# fall-dashboard
# =============================================================================
fallDashboard:
  image: registry-smarko-health.de/fall-detection/fall-dashboard:latest
  # Keep replicas at 1 -- SSE fan-out is in-process; multiple replicas silently drop events
  replicas: 1
  port: 8002

  persistence:
    size: 500Mi         # SQLite patient store -- small, but needs a real PVC
    storageClass: ""    # blank = use k3s cluster default (local-path provisioner)

  # Comma-separated patient IDs and MAC addresses (positional 1:1 mapping)
  patientIds: "CHANGE_ME"    # e.g. "patient_01,patient_02"
  macIds: ""                 # e.g. "aa:bb:cc:dd:ee:01,aa:bb:cc:dd:ee:02" (optional)

  mqtt:
    alertTopic: fall/alert
    possibleTopic: fall/possible
    # Leave blank if mosquitto is configured with allow_anonymous true
    username: ""
    password: ""

  influxdb:
    url: "CHANGE_ME"               # e.g. https://influxdb.xxx.e-healthservice.de
    org: "CHANGE_ME"               # InfluxDB organisation name
    bucket: "CHANGE_ME"            # bucket for raw ACC sensor data (read by fall-dashboard)
    fallEventsBucket: "CHANGE_ME"  # bucket for fall_events measurement (often same as bucket)
    # Token is stored in a Kubernetes Secret.
    # Set this here or pass via --set fallDashboard.influxdb.token=XXX at install time.
    token: "CHANGE_ME"

  ingress:
    # Domain where the Flutter dashboard reaches fall-dashboard on port 443
    host: "CHANGE_ME"    # e.g. fall.xxx.healthservice.de
    # TLS cert resolver -- set if the FOCUS cluster uses Let's Encrypt via Traefik.
    # Leave blank to omit TLS config from this chart (FOCUS handles TLS externally).
    certResolver: ""     # e.g. "le" for Let's Encrypt
