apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: {{ .Values.namespace }}
  labels:
    app: mosquitto
    {{- include "caregiver.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Stop the old broker before starting the new one. RollingUpdate briefly ran
  # two brokers on the same data volume, so clients could land on different ones.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      {{- if .Values.mosquitto.authSecret }}
      securityContext:
        fsGroup: 1883    # mosquitto's group, so the broker can read the login files
      {{- end }}
      containers:
        - name: mosquitto
          image: {{ .Values.mosquitto.image }}
          ports:
            - containerPort: {{ .Values.mosquitto.port }}
              name: mqtt
            - containerPort: {{ .Values.mosquitto.wsPort }}
              name: mqtt-ws
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
            {{- if .Values.mosquitto.authSecret }}
            - name: auth
              mountPath: /mosquitto/secrets
              readOnly: true
            {{- end }}
          # Probe the WebSocket listener: that's what the app and browsers use
          # (through Traefik). A broken 9001 listener would otherwise go unnoticed.
          livenessProbe:
            tcpSocket:
              port: {{ .Values.mosquitto.wsPort }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mosquitto.wsPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
        {{- if .Values.mosquitto.authSecret }}
        - name: auth
          secret:
            secretName: {{ .Values.mosquitto.authSecret }}
            defaultMode: 0440    # owner and group (mosquitto) read only
        {{- end }}
