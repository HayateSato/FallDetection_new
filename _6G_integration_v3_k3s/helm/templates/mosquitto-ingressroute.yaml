{{- if .Values.mosquitto.ingress.tcp }}
# TCP route: Traefik terminates TLS and passes the decrypted WebSocket stream
# to the broker's port 9001. This is the setup live on Hetzner since
# 2026-06-22 (created there by hand first; names kept so Helm can adopt them).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mosquitto-ws-tcp
  namespace: {{ .Values.namespace }}
  labels:
    app: mosquitto
    {{- include "caregiver.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`{{ .Values.mosquitto.ingress.host }}`)
      services:
        - name: mosquitto
          port: {{ .Values.mosquitto.wsPort }}
  tls:
    {{- if .Values.mosquitto.ingress.certResolver }}
    certResolver: {{ .Values.mosquitto.ingress.certResolver }}
    {{- end }}
    {{- if .Values.mosquitto.ingress.tlsMinVersion }}
    options:
      name: mqtt-tls-13
      namespace: {{ .Values.namespace }}
    {{- end }}
{{- if .Values.mosquitto.ingress.tlsMinVersion }}
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: mqtt-tls-13
  namespace: {{ .Values.namespace }}
  labels:
    app: mosquitto
    {{- include "caregiver.labels" . | nindent 4 }}
spec:
  minVersion: {{ .Values.mosquitto.ingress.tlsMinVersion }}
{{- end }}
{{- else }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mosquitto-ws
  namespace: {{ .Values.namespace }}
  labels:
    app: mosquitto
    {{- include "caregiver.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.mosquitto.ingress.host }}`)
      kind: Rule
      services:
        - name: mosquitto
          port: {{ .Values.mosquitto.wsPort }}
  {{- if .Values.mosquitto.ingress.certResolver }}
  tls:
    certResolver: {{ .Values.mosquitto.ingress.certResolver }}
  {{- else }}
  # TLS not configured in this chart. FOCUS cluster handles TLS externally.
  # To enable: set mosquitto.ingress.certResolver in values.yaml.
  tls: {}
  {{- end }}
  # Mobile app (Isa) connects to:
  #   wss://{{ .Values.mosquitto.ingress.host }}    (port 443, TLS at Traefik)
  # Traefik handles WebSocket upgrade automatically -- no extra annotation needed.
{{- end }}
