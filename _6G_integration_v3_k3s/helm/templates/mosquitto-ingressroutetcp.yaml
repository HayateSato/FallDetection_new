apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mosquitto-mqtts
  namespace: {{ .Values.namespace }}
  labels:
    app: mosquitto
    {{- include "caregiver.labels" . | nindent 4 }}
spec:
  # "mqtts" is the Traefik entrypoint defined in extras/traefik-mqtts-entrypoint.yaml.
  # That file must be applied to the cluster ONCE before this chart is installed.
  entryPoints:
    - mqtts
  routes:
    - match: HostSNI(`*`)
      services:
        - name: mosquitto
          port: {{ .Values.mosquitto.port }}
  # TLS is terminated by Traefik. Inside the cluster the connection is plain TCP.
  # To enable TLS termination at Traefik level, uncomment and configure:
  # tls:
  #   certResolver: {{ .Values.fallDashboard.ingress.certResolver | quote }}
