apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: {{ .Values.namespace }}
  labels:
    app: mosquitto
    {{- include "caregiver.labels" . | nindent 4 }}
spec:
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: {{ .Values.mosquitto.port }}
      targetPort: {{ .Values.mosquitto.port }}
  type: ClusterIP
  # fall-dashboard reaches this broker via internal DNS:
  #   mosquitto.fall-dashboard.svc.cluster.local:1883
  # Mobile app reaches it externally via the IngressRouteTCP on port 8883.
