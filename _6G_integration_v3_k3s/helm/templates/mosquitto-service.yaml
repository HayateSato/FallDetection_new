apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: {{ .Values.namespace }}
  labels:
    app: mosquitto
    {{- include "caregiver.labels" . | nindent 4 }}
spec:
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: {{ .Values.mosquitto.port }}
      targetPort: {{ .Values.mosquitto.port }}
    - name: mqtt-ws
      port: {{ .Values.mosquitto.wsPort }}
      targetPort: {{ .Values.mosquitto.wsPort }}
  type: ClusterIP
  # fall-dashboard reaches broker via internal DNS (plain TCP):
  #   mosquitto.fall-dashboard.svc.cluster.local:1883
  # Traefik reaches broker for mobile app WebSocket traffic:
  #   mosquitto.fall-dashboard.svc.cluster.local:9001
