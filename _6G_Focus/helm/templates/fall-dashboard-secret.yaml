apiVersion: v1
kind: Secret
metadata:
  name: fall-dashboard-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app: fall-dashboard
    {{- include "caregiver.labels" . | nindent 4 }}
type: Opaque
stringData:
  # InfluxDB auth token -- required for both reading fall_events and fall counts
  INFLUXDB_TOKEN: {{ .Values.fallDashboard.influxdb.token | quote }}
  # MQTT credentials -- only needed if mosquitto is configured with password_file auth
  MQTT_USERNAME: {{ .Values.fallDashboard.mqtt.username | quote }}
  MQTT_PASSWORD: {{ .Values.fallDashboard.mqtt.password | quote }}
