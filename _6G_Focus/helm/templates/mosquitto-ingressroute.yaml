apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mosquitto-ws
  namespace: {{ .Values.namespace }}
  labels:
    app: mosquitto
    {{- include "caregiver.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.mosquitto.ingress.host }}`)
      kind: Rule
      services:
        - name: mosquitto
          port: {{ .Values.mosquitto.wsPort }}
  {{- if .Values.mosquitto.ingress.certResolver }}
  tls:
    certResolver: {{ .Values.mosquitto.ingress.certResolver }}
  {{- else }}
  # TLS not configured in this chart. FOCUS cluster handles TLS externally.
  # To enable: set mosquitto.ingress.certResolver in values.yaml.
  tls: {}
  {{- end }}
  # Mobile app (Isa) connects to:
  #   wss://{{ .Values.mosquitto.ingress.host }}    (port 443, TLS at Traefik)
  # Traefik handles WebSocket upgrade automatically -- no extra annotation needed.
