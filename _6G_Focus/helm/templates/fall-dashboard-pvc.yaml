apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fall-dashboard-data
  namespace: {{ .Values.namespace }}
  labels:
    app: fall-dashboard
    {{- include "caregiver.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.fallDashboard.persistence.size }}
  {{- if .Values.fallDashboard.persistence.storageClass }}
  storageClassName: {{ .Values.fallDashboard.persistence.storageClass }}
  {{- end }}
  # This PVC holds the SQLite patient store at /app/data/patients.db.
  # It survives pod restarts and redeployments -- do NOT delete it unless
  # you intend to wipe all patient registration data.
