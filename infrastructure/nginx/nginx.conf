worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Upstream service definitions
    upstream ml_server     { server ml_server:8001; }
    upstream caregiver_api { server caregiver_api:8002; }
    upstream emergency_svc { server emergency_svc:8003; }
    upstream grafana       { server grafana:3000; }

    server {
        listen 80;
        server_name _;   # matches any hostname; replace with your domain in production

        # ------------------------------------------------------------------
        # ML Inference Server — API key protected (handled by FastAPI)
        # ------------------------------------------------------------------
        location /api/ml/ {
            proxy_pass         http://ml_server/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # Caregiver API — JWT protected (handled by FastAPI)
        # ------------------------------------------------------------------
        location /api/caregiver/ {
            proxy_pass         http://caregiver_api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $remote_addr;
        }

        # ------------------------------------------------------------------
        # Emergency SSE stream — long-lived connections need special headers
        # proxy_buffering off is CRITICAL for SSE: without it nginx buffers
        # the response and the client never sees events in real time.
        # ------------------------------------------------------------------
        location /api/emergency/stream {
            proxy_pass         http://emergency_svc/stream;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_set_header   Connection "";       # disable chunked encoding
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;               # keep SSE connection alive for 1h
        }

        location /api/emergency/ {
            proxy_pass         http://emergency_svc/;
            proxy_set_header   X-Forwarded-For $remote_addr;
        }

        # ------------------------------------------------------------------
        # Grafana dashboard — internal access only (no public exposure)
        # Add IP allowlist here if needed:
        #   allow 10.0.0.0/8;
        #   deny all;
        # ------------------------------------------------------------------
        location /grafana/ {
            proxy_pass         http://grafana/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $remote_addr;
        }

        # ------------------------------------------------------------------
        # Static dashboards — served directly by nginx (no Python needed)
        # ------------------------------------------------------------------
        location /operator/ {
            root  /www/static;
            try_files $uri $uri/ /operator/index.html;
        }

        location /caregiver/ {
            root  /www/static;
            try_files $uri $uri/ /caregiver/index.html;
        }

        location /emergency/ {
            root  /www/static;
            try_files $uri $uri/ /emergency/index.html;
        }

        # Health check endpoint (nginx itself)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
