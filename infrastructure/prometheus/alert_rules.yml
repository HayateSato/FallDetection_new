groups:
  - name: ml_server_alerts
    rules:

      # Alert when p95 inference latency exceeds 2 seconds for 2 minutes
      - alert: HighInferenceLatency
        expr: >
          histogram_quantile(0.95,
            rate(inference_latency_seconds_bucket[5m])
          ) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Inference p95 latency > 2s"
          description: >
            The 95th percentile inference latency is {{ $value | humanizeDuration }}.
            Possible causes: model too large, slow CPU, or Postgres write blocking.

      # Alert when fall confidence median drops below 0.6 (model drift indicator)
      - alert: ConfidenceDrift
        expr: >
          histogram_quantile(0.5,
            rate(model_confidence_bucket{fall_detected="true"}[1h])
          ) < 0.6
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Median fall confidence dropping — possible model drift"
          description: >
            Median fall detection confidence is {{ $value | humanize }}.
            A healthy model should have median confidence > 0.6 for true falls.
            Consider retraining if sensor data distribution has changed.

      # Alert if ml_server is down
      - alert: MlServerDown
        expr: up{job="ml_server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ML inference server is unreachable"
          description: "Prometheus cannot scrape ml_server:8001/metrics. Fall detection is offline."

      # Alert on high error rate (5xx responses)
      - alert: HighErrorRate
        expr: >
          rate(http_requests_total{job="ml_server", status_code=~"5.."}[5m])
          /
          rate(http_requests_total{job="ml_server"}[5m])
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ML server error rate > 5%"
          description: "More than 5% of requests to ml_server are returning 5xx errors."
