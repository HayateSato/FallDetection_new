<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caregiver Dashboard — 6G / Charite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Live fall alert banner -->
  <div id="alert-banner" class="alert-banner hidden">
    <div class="alert-content">
      <span class="alert-icon">!</span>
      <span id="alert-text">FALL DETECTED</span>
    </div>
    <button onclick="dismissAlert()">Dismiss</button>
  </div>

  <header>
    <div class="header-left">
      <h1>Caregiver Dashboard</h1>
      <span class="subtitle">6G / Charite Fall Detection</span>
    </div>
    <div id="header-stats">
      <div class="stat-chip">
        <span class="stat-label">Patients</span>
        <span id="stat-patients" class="stat-value">—</span>
      </div>
      <div class="stat-chip">
        <span class="stat-label">Falls today</span>
        <span id="stat-falls-today" class="stat-value">—</span>
      </div>
      <div class="stat-chip">
        <span class="stat-label">Live status</span>
        <span id="stat-stream" class="stat-value status-disconnected">Disconnected</span>
      </div>
    </div>
  </header>

  <nav class="tab-bar">
    <button class="tab active" onclick="switchTab('patients')">Patients</button>
    <button class="tab" onclick="switchTab('history')">Fall History</button>
  </nav>

  <main id="tab-patients" class="tab-content">
    <div id="patient-list" class="patient-grid">
      <p class="loading">Loading patients...</p>
    </div>
  </main>

  <main id="tab-history" class="tab-content hidden">
    <div class="filter-bar">
      <div class="filter-group">
        <label for="filter-patient">Patient</label>
        <input id="filter-patient" type="text" placeholder="All patients" />
      </div>
      <div class="filter-group">
        <label for="filter-confirmed">Patient confirmed</label>
        <select id="filter-confirmed">
          <option value="">Any</option>
          <option value="yes">Yes — fell</option>
          <option value="no">No — didn't fall</option>
          <option value="not_answered">Not answered</option>
        </select>
      </div>
      <button onclick="loadHistory()" class="btn-primary">Apply</button>
      <button onclick="resetFilters()" class="btn-secondary">Reset</button>
    </div>

    <table class="data-table" id="history-table">
      <thead>
        <tr>
          <th>Detection time</th>
          <th>Patient</th>
          <th>Fall</th>
          <th>Confirmed</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="history-tbody">
        <tr><td colspan="5" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </main>

  <script src="app.js"></script>
</body>
</html>
