<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>server_health — Fall Detection Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>server_health</h1>
    <span class="subtitle">Fall Detection — admin: service status</span>
    <span class="warning-banner">Auth not yet enforced — local / cluster-internal use only</span>
  </header>

  <main>

    <section class="card overall-card">
      <div class="overall-row">
        <span id="overall-icon" class="overall-icon">●</span>
        <div>
          <div id="overall-text" class="overall-text">Checking…</div>
          <div id="overall-sub"  class="overall-sub">Probing 6 services</div>
        </div>
        <button class="btn-primary" onclick="refresh()">Refresh now</button>
      </div>
    </section>

    <section class="card">
      <h2>Services</h2>
      <p class="hint">One probe per service. Plain-language status — not SRE metrics.
        For latency / drift / metrics over time, see Grafana.</p>
      <div id="services" class="services-grid">
        <div class="loading">Loading…</div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
