# Alembic configuration file — fall detection 6G integration
# Run from the _6G_Integration_v2_mqtt/ directory:
#   alembic upgrade head
#
# DATABASE_URL is read from the environment (or .env via env.py).
# Default: sqlite:///./caregiver.db
# Production: postgresql+psycopg2://user:pass@host:5432/fall_detection

[alembic]
script_location = shared/db/migrations

# DATABASE_URL defined in shared\db\migrations\env.py will overwrite the url below.
# Do NOT hardcode credentials here.
sqlalchemy.url = sqlite:///./caregiver.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
