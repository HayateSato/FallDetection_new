# eclipse-mosquitto configuration — local development
# No authentication (add password_file for production)

listener 1883
allow_anonymous true

# WebSocket listener (optional — useful for browser-based MQTT debug tools)
listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
