# eclipse-mosquitto configuration — production
#
# To enable authentication (recommended):
#   1. Generate a password file:
#        docker run --rm -it eclipse-mosquitto:2 mosquitto_passwd -c /mosquitto/config/passwd <username>
#        Copy the output to a file on the host, e.g. deploy/passwd
#   2. Mount the file in docker-compose.yml (add to mqtt volumes):
#        - ./passwd:/mosquitto/config/passwd:ro
#   3. Uncomment password_file and set allow_anonymous false below.
#
# To enable TLS on port 8883:
#   Mount your cert/key into the container and add listener + certfile/keyfile config.

listener 1883
# password_file /mosquitto/config/passwd
# allow_anonymous false
allow_anonymous true

# Uncomment to enable TLS (port 8883)
# listener 8883
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# cafile   /mosquitto/certs/ca.crt

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
