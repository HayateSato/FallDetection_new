<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient — Fall Detection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Standby screen */
    #standby {
      text-align: center;
      color: #6b7280;
    }
    #standby h1 { font-size: 1.5rem; color: #374151; margin-bottom: 0.5rem; }
    #standby .status { font-size: 0.9rem; margin-top: 1rem; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.4rem; }
    .dot-green { background: #059669; }
    .dot-grey  { background: #9ca3af; }

    /* Popup overlay */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .popup-overlay.active { display: flex; }

    .popup-box {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .popup-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.5rem;
    }
    .popup-subtitle {
      font-size: 0.95rem;
      color: #6b7280;
      margin-bottom: 1.5rem;
    }

    /* Countdown ring */
    .countdown-container {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
    }
    .countdown-container svg { transform: rotate(-90deg); }
    .countdown-bg { stroke: #e5e7eb; }
    .countdown-ring { stroke: #dc2626; transition: stroke-dashoffset 1s linear; }
    .countdown-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      font-weight: 700;
      color: #dc2626;
    }

    .popup-buttons { display: flex; gap: 1rem; justify-content: center; }
    .btn-yes, .btn-no {
      padding: 0.9rem 2.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      min-width: 120px;
    }
    .btn-yes { background: #dc2626; color: white; }
    .btn-yes:hover { background: #b91c1c; }
    .btn-no  { background: #e5e7eb; color: #374151; }
    .btn-no:hover { background: #d1d5db; }

    /* Sent confirmation */
    .popup-sent {
      font-size: 1.2rem;
      color: #059669;
      font-weight: 600;
      padding: 1rem 0;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Standby screen -->
  <div id="standby">
    <h1>Fall Detection — Patient Monitor</h1>
    <p>Monitoring is active. This page will alert you if a fall is detected.</p>
    <div class="status">
      <span id="status-dot" class="dot dot-grey"></span>
      <span id="status-text">Connecting...</span>
    </div>
  </div>

  <!-- Popup: Did you fall? -->
  <div id="popup-fall" class="popup-overlay">
    <div class="popup-box">
      <div class="popup-title">Strong impact detected</div>
      <div class="popup-subtitle">Did you fall?</div>
      <div class="countdown-container">
        <svg width="80" height="80">
          <circle class="countdown-bg" cx="40" cy="40" r="34" fill="none" stroke-width="6"/>
          <circle id="ring-fall" class="countdown-ring" cx="40" cy="40" r="34" fill="none"
                  stroke-width="6" stroke-dasharray="213.6" stroke-dashoffset="0" stroke-linecap="round"/>
        </svg>
        <div id="timer-fall" class="countdown-text">10</div>
      </div>
      <div class="popup-buttons">
        <button class="btn-yes" onclick="answerFall('yes')">YES</button>
        <button class="btn-no"  onclick="answerFall('no')">NO</button>
      </div>
    </div>
  </div>

  <!-- Popup: Do you need help? -->
  <div id="popup-help" class="popup-overlay">
    <div class="popup-box">
      <div class="popup-title">Do you need help?</div>
      <div class="popup-subtitle">A caregiver will be notified if you need assistance.</div>
      <div class="countdown-container">
        <svg width="80" height="80">
          <circle class="countdown-bg" cx="40" cy="40" r="34" fill="none" stroke-width="6"/>
          <circle id="ring-help" class="countdown-ring" cx="40" cy="40" r="34" fill="none"
                  stroke-width="6" stroke-dasharray="213.6" stroke-dashoffset="0" stroke-linecap="round"/>
        </svg>
        <div id="timer-help" class="countdown-text">10</div>
      </div>
      <div class="popup-buttons">
        <button class="btn-yes" onclick="answerHelp('yes')">YES — I need help</button>
        <button class="btn-no"  onclick="answerHelp('no')">NO — I'm fine</button>
      </div>
    </div>
  </div>

  <!-- Popup: Feedback sent -->
  <div id="popup-done" class="popup-overlay">
    <div class="popup-box">
      <div id="done-message" class="popup-sent">Thank you. Response recorded.</div>
      <div class="popup-subtitle" id="done-detail"></div>
    </div>
  </div>

  <script src="patient.js"></script>
</body>
</html>
