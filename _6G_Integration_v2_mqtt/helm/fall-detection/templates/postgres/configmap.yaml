# Postgres init script — creates the mlflow database alongside fall_detection.
# Runs once on first startup (postgres docker-entrypoint-initdb.d convention).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: {{ .Values.namespaces.ours }}
data:
  init.sql: |
    CREATE DATABASE mlflow;
    GRANT ALL PRIVILEGES ON DATABASE mlflow TO {{ .Values.postgres.user }};
