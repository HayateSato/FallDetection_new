# Prometheus scrape config — scrapes inference-server /metrics every 15s.
# In K8s, services are reachable by their service name within the same namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespaces.ours }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: inference-server
        static_configs:
          - targets: ['inference-server:{{ .Values.inferenceServer.port }}']
        metrics_path: /metrics
