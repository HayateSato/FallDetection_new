# One-shot Job — creates the mlflow-artifacts bucket in MinIO after install/upgrade.
# Uses minio/mc (MinIO Client) to run mb --ignore-existing so re-runs are safe.
# Runs as a post-install + post-upgrade hook, same pattern as the Alembic migrate-job.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: {{ .Values.namespaces.ours }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fall-detection-secrets
                  key: minio-root-password
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://minio:{{ .Values.minio.port }} {{ .Values.minio.rootUser }} $MINIO_ROOT_PASSWORD; do
                echo "waiting for MinIO..."; sleep 3
              done
              mc mb --ignore-existing local/mlflow-artifacts
              echo "bucket ready"
