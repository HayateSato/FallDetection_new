{{- if .Values.ingress.enabled }}
# Exposes fall-dashboard /api/* to FOCUS namespace (Patient Dashboard reads fall data + SSE).
# Exposes inference-server /predict to the mobile app (external traffic).
# Ingress controller: Traefik. Traefik does not buffer streaming responses by default,
# so /api/stream (SSE) works without extra annotations.
# If SSE connections drop after ~30s, add a Traefik Middleware with responseHeaderTimeout.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fall-detection-ingress
  namespace: {{ .Values.namespaces.ours }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.fallDashboardPath }}
            pathType: Prefix
            backend:
              service:
                name: fall-dashboard
                port:
                  number: {{ .Values.fallDashboard.port }}
          - path: {{ .Values.ingress.inferenceServerPath }}
            pathType: Prefix
            backend:
              service:
                name: inference-server
                port:
                  number: {{ .Values.inferenceServer.port }}
{{- end }}
