{{- if .Values.ingress.enabled }}
# Exposes fall-dashboard /api/* to FOCUS namespace (Patient Dashboard reads fall data + SSE).
# Exposes inference-server /predict to the mobile app (external traffic).
# SSE annotations disable buffering so /api/stream stays alive.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fall-detection-ingress
  namespace: {{ .Values.namespaces.ours }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.fallDashboardPath }}
            pathType: Prefix
            backend:
              service:
                name: fall-dashboard
                port:
                  number: {{ .Values.fallDashboard.port }}
          - path: {{ .Values.ingress.inferenceServerPath }}
            pathType: Prefix
            backend:
              service:
                name: inference-server
                port:
                  number: {{ .Values.inferenceServer.port }}
{{- end }}
