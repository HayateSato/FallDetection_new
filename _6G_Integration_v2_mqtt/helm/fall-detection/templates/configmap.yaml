# Shared environment variables — mounted into inference-server and fall-dashboard pods.
# Secrets (passwords, API keys) are in secrets.yaml, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fall-detection-config
  namespace: {{ .Values.namespaces.ours }}
data:
  DATABASE_URL:               "postgresql+psycopg2://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
  MQTT_BROKER_HOST:           "mqtt-broker"
  MQTT_BROKER_PORT:           "{{ .Values.mqtt.port }}"
  MQTT_ALERT_TOPIC:           "fall/alert"
  MODEL_VERSION:              "{{ .Values.inferenceServer.modelVersion }}"
  FHIR_SERVER_URL:            "{{ .Values.inferenceServer.fhirServerUrl }}"
  FHIR_PUSH_ON_FALL_ONLY:     "{{ .Values.inferenceServer.fhirPushOnFallOnly }}"
  MLFLOW_TRACKING_URI:        "http://mlflow:{{ .Values.mlflow.port }}"
  MLFLOW_S3_ENDPOINT_URL:     "http://minio:{{ .Values.minio.port }}"
  MLFLOW_ARTIFACT_ROOT:       "s3://{{ .Values.minio.bucketName }}/"
  CAREGIVER_HOST:             "0.0.0.0"
  CAREGIVER_PORT:             "{{ .Values.fallDashboard.port }}"
  HARDWARE_ACC_SAMPLE_RATE:   "{{ .Values.inferenceServer.hardwareAccSampleRate }}"
  ACC_SENSOR_TYPE:            "{{ .Values.inferenceServer.accSensorType }}"
  RESAMPLING_METHOD:          "{{ .Values.inferenceServer.resamplingMethod }}"
  PATIENT_IDS:                "{{ .Values.fallDashboard.patientIds }}"
  MAC_IDS:                    "{{ .Values.fallDashboard.macIds }}"
  POLL_INTERVAL_SECONDS:      "{{ .Values.fallDashboard.pollIntervalSeconds }}"
  MOCK_PATIENT_RESPONSE_TIMEOUT: "{{ .Values.fallDashboard.mockPatientResponseTimeout }}"
  SERVER_PORT:                "{{ .Values.inferenceServer.port }}"
  PUBLIC_ENDPOINT_ENABLED:    "true"
  RATE_LIMIT_PER_MINUTE:      "60"
  CORS_ALLOWED_ORIGINS:       "*"
  INFERENCE_SERVER_URL:       "http://inference-server:{{ .Values.inferenceServer.port }}"
  FALL_DASHBOARD_URL:         "http://fall-dashboard:{{ .Values.fallDashboard.port }}"
