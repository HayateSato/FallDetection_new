# replicas: 1 — Prometheus counters are per-process; more than 1 splits metrics across pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-server
  namespace: {{ .Values.namespaces.ours }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-server
  template:
    metadata:
      labels:
        app: inference-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ .Values.inferenceServer.port }}"
    spec:
      containers:
        - name: inference-server
          image: {{ .Values.registry }}/{{ .Values.images.inferenceServer.repository }}:{{ .Values.images.inferenceServer.tag }}
          ports:
            - containerPort: {{ .Values.inferenceServer.port }}
          envFrom:
            - configMapRef:
                name: fall-detection-config
          env:
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: fall-detection-secrets
                  key: api-keys
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.minio.rootUser }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fall-detection-secrets
                  key: minio-root-password
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.inferenceServer.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.inferenceServer.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
