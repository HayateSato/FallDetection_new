# Runs Alembic migrations automatically after every helm install / helm upgrade.
# Uses the fall-dashboard image (which has alembic.ini + shared/db/).
apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-migrate
  namespace: {{ .Values.namespaces.ours }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: alembic
          image: {{ .Values.registry }}/{{ .Values.images.fallDashboard.repository }}:{{ .Values.images.fallDashboard.tag }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: fall-detection-config
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg2://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
