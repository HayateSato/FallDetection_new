apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-health
  namespace: {{ .Values.namespaces.ours }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server-health
  template:
    metadata:
      labels:
        app: server-health
    spec:
      containers:
        - name: server-health
          image: {{ .Values.registry }}/{{ .Values.images.serverHealth.repository }}:{{ .Values.images.serverHealth.tag }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.serverHealth.port }}
          envFrom:
            - configMapRef:
                name: fall-detection-config
          resources:
            requests:
              cpu:    {{ .Values.resources.serverHealth.requests.cpu }}
              memory: {{ .Values.resources.serverHealth.requests.memory }}
            limits:
              cpu:    {{ .Values.resources.serverHealth.limits.cpu }}
              memory: {{ .Values.resources.serverHealth.limits.memory }}
          readinessProbe:
            httpGet:
              path: /api/status
              port: {{ .Values.serverHealth.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: {{ .Values.serverHealth.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
