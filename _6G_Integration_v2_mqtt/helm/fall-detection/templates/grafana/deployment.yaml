apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespaces.ours }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          ports:
            - containerPort: {{ .Values.grafana.port }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fall-detection-secrets
                  key: grafana-admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fall-detection-secrets
                  key: postgres-password
          resources:
            requests:
              cpu:    {{ .Values.resources.grafana.requests.cpu }}
              memory: {{ .Values.resources.grafana.requests.memory }}
            limits:
              cpu:    {{ .Values.resources.grafana.limits.cpu }}
              memory: {{ .Values.resources.grafana.limits.memory }}
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            # Grafana expects provisioning files in SUBDIRECTORIES (datasources/, dashboards/),
            # not at /etc/grafana/provisioning root. We project each ConfigMap key into the
            # subdirectory Grafana scans.
            - name: grafana-provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: grafana-data
          emptyDir: {}
        - name: grafana-provisioning-datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        - name: grafana-provisioning-dashboards
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
