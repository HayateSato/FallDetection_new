# Grafana dashboard ConfigMap — JSON files embedded at helm install time via .Files.Get.
# Grafana reads these from /var/lib/grafana/dashboards (mounted in deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Values.namespaces.ours }}
data:
  ml_server_overview.json: {{ .Files.Get "files/grafana/dashboards/ml_server_overview.json" | quote }}
  model_performance.json: {{ .Files.Get "files/grafana/dashboards/model_performance.json" | quote }}
  fall_events_timeline.json: {{ .Files.Get "files/grafana/dashboards/fall_events_timeline.json" | quote }}
