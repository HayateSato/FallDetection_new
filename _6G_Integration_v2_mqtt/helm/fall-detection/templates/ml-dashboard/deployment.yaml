apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-dashboard
  namespace: {{ .Values.namespaces.ours }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-dashboard
  template:
    metadata:
      labels:
        app: ml-dashboard
    spec:
      containers:
        - name: ml-dashboard
          image: {{ .Values.registry }}/{{ .Values.images.mlDashboard.repository }}:{{ .Values.images.mlDashboard.tag }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.mlDashboard.port }}
          envFrom:
            - configMapRef:
                name: fall-detection-config
          env:
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.minio.rootUser }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fall-detection-secrets
                  key: minio-root-password
          resources:
            requests:
              cpu:    {{ .Values.resources.mlDashboard.requests.cpu }}
              memory: {{ .Values.resources.mlDashboard.requests.memory }}
            limits:
              cpu:    {{ .Values.resources.mlDashboard.limits.cpu }}
              memory: {{ .Values.resources.mlDashboard.limits.memory }}
          readinessProbe:
            httpGet:
              path: /api/status
              port: {{ .Values.mlDashboard.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: {{ .Values.mlDashboard.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
