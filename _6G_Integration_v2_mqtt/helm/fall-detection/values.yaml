# helm/fall-detection/values.yaml
# Single file to change per environment (dev / staging / production).
# Placeholders marked with TODO must be confirmed with FOCUS DevOps before deploying.

# ── Namespaces ────────────────────────────────────────────────────────────────
namespaces:
  ours: mcs-fall-detection    # NEW namespace for the fall-detection components we ship this time (FOCUS DevOps may override)
  focus: focus-ns             # EXISTING FOCUS namespace already running in the cluster (FHIR, InfluxDB, Patient Dashboard) — TODO: confirm with FOCUS DevOps

# ── Container registry ────────────────────────────────────────────────────────
registry: registry.example.com   # TODO: confirm with FOCUS DevOps

# ── Image tags ────────────────────────────────────────────────────────────────
# pullPolicy: Never   → local test (Docker Desktop K8s — images must be built locally first)
# pullPolicy: Always  → production (images pulled from real registry on every deploy)
images:
  pullPolicy: Never
  inferenceServer:
    repository: inference-server
    tag: latest
  fallDashboard:
    repository: fall-dashboard
    tag: latest
  mlDashboard:
    repository: ml-dashboard
    tag: latest
  serverHealth:
    repository: server-health
    tag: latest

# ── Inference server ──────────────────────────────────────────────────────────
inferenceServer:
  port: 8001
  modelVersion: v0
  apiKeys: "changeme"           # override via --set in production
  fhirServerUrl: ""             # set to FOCUS FHIR server URL once confirmed
  fhirPushOnFallOnly: "true"
  accSensorType: bosch
  hardwareAccSampleRate: "50"
  resamplingMethod: linear

# ── Fall dashboard ────────────────────────────────────────────────────────────
fallDashboard:
  port: 8002
  patientIds: "sato_helm_test_2"   # comma-separated
  macIds: "6c:1d:eb:04:a9:e6"      # comma-separated, positional with patientIds
  pollIntervalSeconds: "10"
  mockPatientResponseTimeout: "10"

# ── ML dashboard (admin — retrain + model hot-swap) ───────────────────────────
mlDashboard:
  port: 8004

# ── Server health dashboard (admin — service status) ──────────────────────────
serverHealth:
  port: 8006

# ── MQTT broker ───────────────────────────────────────────────────────────────
mqtt:
  port: 1883
  websocketPort: 9001
  image: eclipse-mosquitto:2

# ── Postgres ──────────────────────────────────────────────────────────────────
postgres:
  image: postgres:16-alpine
  port: 5432
  database: fall_detection
  user: fall_user
  password: fall_pass           # override via --set in production
  storageSize: 10Gi
  storageClass: ""              # TODO: confirm storage class with FOCUS DevOps

# ── MLflow ────────────────────────────────────────────────────────────────────
mlflow:
  image: ghcr.io/mlflow/mlflow:latest
  port: 5000

# ── MinIO (MLflow artifact store) ─────────────────────────────────────────────
minio:
  image: minio/minio:latest
  port: 9000
  consolePort: 9001
  storageSize: 20Gi
  storageClass: ""              # TODO: confirm storage class with FOCUS DevOps
  rootUser: minio
  rootPassword: minio123        # override via --set in production
  bucketName: mlflow-artifacts

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  image: prom/prometheus:latest
  port: 9090

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  image: grafana/grafana:10.4.0
  port: 3000
  adminPassword: admin          # override via --set in production

# ── Resource limits ───────────────────────────────────────────────────────────
# Cluster total: 32 GB RAM (confirmed 2026-04-27). Total limits well within that.
resources:
  inferenceServer:
    requests: { cpu: 500m,  memory: 512Mi }
    limits:   { cpu: "2",   memory: 2Gi   }
  fallDashboard:
    requests: { cpu: 250m,  memory: 256Mi }
    limits:   { cpu: "1",   memory: 512Mi }
  mqttBroker:
    requests: { cpu: 100m,  memory: 128Mi }
    limits:   { cpu: 500m,  memory: 256Mi }
  postgres:
    requests: { cpu: 250m,  memory: 512Mi }
    limits:   { cpu: "1",   memory: 2Gi   }
  mlflow:
    requests: { cpu: 250m,  memory: 512Mi }
    limits:   { cpu: "1",   memory: 2Gi   }   # 1Gi was being OOM-killed (4 gunicorn workers × ~300MiB each)
  minio:
    requests: { cpu: 250m,  memory: 512Mi }
    limits:   { cpu: "1",   memory: 2Gi   }
  prometheus:
    requests: { cpu: 250m,  memory: 512Mi }
    limits:   { cpu: "1",   memory: 2Gi   }
  grafana:
    requests: { cpu: 100m,  memory: 128Mi }
    limits:   { cpu: 500m,  memory: 512Mi }
  mlDashboard:
    requests: { cpu: 250m,  memory: 256Mi }
    limits:   { cpu: "1",   memory: 512Mi }
  serverHealth:
    requests: { cpu: 100m,  memory: 128Mi }
    limits:   { cpu: 500m,  memory: 256Mi }

# ── Ingress ───────────────────────────────────────────────────────────────────
# Ingress controller: Traefik (confirmed 2026-04-27).
ingress:
  enabled: true
  host: fall-detection.example.com    # TODO: confirm with FOCUS DevOps
  inferenceServerPath: /predict
  fallDashboardPath: /api
