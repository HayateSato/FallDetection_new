apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-patient-dashboard
  namespace: {{ .Values.namespace }}
  labels:
    app: mock-patient-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-patient-dashboard
  template:
    metadata:
      labels:
        app: mock-patient-dashboard
    spec:
      containers:
        - name: mock-patient-dashboard
          image: {{ .Values.mockPatientDashboard.image }}
          imagePullPolicy: {{ .Values.mockPatientDashboard.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.mockPatientDashboard.port }}
          env:
            # Cross-namespace target — proves DNS-based service discovery works.
            - name: FALL_DASHBOARD_URL
              value: {{ .Values.mockPatientDashboard.fallDashboardUrl | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.mockPatientDashboard.port }}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mock-patient-dashboard
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: mock-patient-dashboard
  ports:
    - port: {{ .Values.mockPatientDashboard.port }}
      targetPort: {{ .Values.mockPatientDashboard.port }}
      nodePort: 30090
      protocol: TCP
