apiVersion: v2
name: mock-focus
description: |
  Simulated FOCUS namespace — used ONLY for local two-namespace dry-run
  before handing the real chart to FOCUS DevOps. Contains a mock FHIR
  server, a mock InfluxDB instance, and a minimal Patient Dashboard that
  consumes our fall_dashboard SSE stream from across namespaces.
  This chart never ships to production. FOCUS DevOps replaces it with
  real services in their own namespace.
type: application
version: 0.1.0
appVersion: "1.0"
