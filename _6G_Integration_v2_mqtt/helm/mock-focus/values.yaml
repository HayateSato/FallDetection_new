# Default values for the mock-focus chart.
# This chart simulates the FOCUS namespace for local two-namespace dry-run testing.
# Override only when running on a non-default cluster.

namespace: mock-focus

mockFhir:
  image: fd-mock-fhir:latest    # built locally — see helm/mock-focus/build.ps1
  imagePullPolicy: IfNotPresent
  port: 8003

mockInfluxDB:
  image: influxdb:2.7
  imagePullPolicy: IfNotPresent
  port: 8086
  storage: 1Gi
  initOrg: focus
  initBucket: biosignals
  initUser: focus-admin
  initPassword: focus-admin-pass     # local dev only — never use in production
  initToken: focus-dev-token

mockPatientDashboard:
  image: fd-mock-patient-dashboard:latest
  imagePullPolicy: IfNotPresent
  port: 8090
  # FQDN of our fall_dashboard service in the OTHER namespace
  fallDashboardUrl: http://fall-dashboard.mcs-fall-detection.svc.cluster.local:8002
