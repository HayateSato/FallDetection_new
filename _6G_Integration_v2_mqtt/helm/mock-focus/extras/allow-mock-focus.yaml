# Allow rule that lets the mock-patient-dashboard in mock-focus reach
# our fall-dashboard service on port 8002.
#
# Apply AFTER deny-all-cross-namespace.yaml is in place, then verify the
# mock dashboard at http://localhost:30090/ recovers.
#
# In production, FOCUS DevOps writes a similar rule for the real Patient
# Dashboard pods.
#
# Apply:
#   kubectl apply -f helm/mock-focus/extras/allow-mock-focus.yaml

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mock-focus-to-fall-dashboard
  namespace: mcs-fall-detection
spec:
  podSelector:
    matchLabels:
      app: fall-dashboard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: mock-focus
          podSelector:
            matchLabels:
              app: mock-patient-dashboard
      ports:
        - protocol: TCP
          port: 8002
