apiVersion: v1
kind: Service
metadata:
  name: fall-dashboard
  namespace: {{ .Values.namespace }}
  labels:
    app: fall-dashboard
    {{- include "caregiver.labels" . | nindent 4 }}
spec:
  selector:
    app: fall-dashboard
  ports:
    - name: http
      port: {{ .Values.fallDashboard.port }}
      targetPort: {{ .Values.fallDashboard.port }}
  type: ClusterIP
