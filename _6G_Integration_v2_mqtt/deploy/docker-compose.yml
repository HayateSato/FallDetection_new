# =============================================================================
# Fall Detection — Production Docker Compose (MCS / Hetzner)
# =============================================================================
#
# Run from _6G_Integration_v2_mqtt/ as working directory:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Or from inside deploy/:
#   docker compose up -d
#
# First-time setup: copy deploy/.env.example to deploy/.env and fill in secrets.
#
# Services (10 long-running + 2 one-off init jobs):
#   inference-server  :8001   Fall detection API (public — put behind reverse proxy)
#   fall-dashboard    :8002   SSE + /api/falls (consumed by FOCUS Flutter dashboard)
#   ml-dashboard      :8004   Admin UI — retrain + model hot-swap (internal only)
#   server-health     :8006   Aggregate health probe dashboard (internal only)
#   postgres          :5432   Shared database (inference_log, feature_snapshot, MLflow)
#   mqtt              :1883   MQTT broker (mobile app publishes; fall-dashboard subscribes)
#   mlflow            :5000   ML experiment tracking + model registry (internal only)
#   minio             :9000   Model artifact store — S3-compatible (internal only)
#   prometheus        :9090   Metrics scraping (internal only)
#   grafana           :3000   ML dashboards (internal only)
#   db-migrate        ---     One-off: runs alembic upgrade head, then exits
#   minio-setup       ---     One-off: creates mlflow-artifacts bucket, then exits
# =============================================================================

services:

  # ── One-off: Alembic migration ─────────────────────────────────────────────
  # Runs before fall-dashboard and inference-server start.
  # Applies migration 0003 (fall_history dropped, patient_confirmed added).
  db-migrate:
    build:
      context: ..
      dockerfile: fall_dashboard/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg2://fall_user:${POSTGRES_PASSWORD:-fall_pass}@postgres:5432/fall_detection
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [fall-net]

  # ── One-off: MinIO bucket creation ─────────────────────────────────────────
  # Creates the mlflow-artifacts bucket on first start (idempotent).
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_USER:-minioadmin} ${MINIO_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/mlflow-artifacts &&
      echo 'MinIO bucket ready.' &&
      exit 0
      "
    restart: "no"
    networks: [fall-net]

  # ── Python services ────────────────────────────────────────────────────────

  inference-server:
    build:
      context: ..
      dockerfile: inference_server/Dockerfile
    image: fall-detection/inference-server:latest
    container_name: fall_inference_server
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MODEL_VERSION:             ${MODEL_VERSION:-v0}
      ACC_SENSOR_TYPE:           ${ACC_SENSOR_TYPE:-bosch}
      HARDWARE_ACC_SAMPLE_RATE:  ${HARDWARE_ACC_SAMPLE_RATE:-50}
      RESAMPLING_METHOD:         ${RESAMPLING_METHOD:-linear}
      DATABASE_URL:              postgresql+psycopg2://fall_user:${POSTGRES_PASSWORD:-fall_pass}@postgres:5432/fall_detection
      PUBLIC_ENDPOINT_ENABLED:   ${PUBLIC_ENDPOINT_ENABLED:-true}
      API_KEYS:                  ${API_KEYS}
      RATE_LIMIT_PER_MINUTE:     ${RATE_LIMIT_PER_MINUTE:-60}
      CORS_ALLOWED_ORIGINS:      ${CORS_ALLOWED_ORIGINS:-*}
      SERVER_PORT:               "8001"
      MLFLOW_TRACKING_URI:       http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL:    http://minio:9000
      AWS_ACCESS_KEY_ID:         ${MINIO_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY:     ${MINIO_PASSWORD:-minioadmin}
      FHIR_SERVER_URL:           ""
      FHIR_PUSH_ON_FALL_ONLY:    "true"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [fall-net]

  fall-dashboard:
    build:
      context: ..
      dockerfile: fall_dashboard/Dockerfile
    image: fall-detection/fall-dashboard:latest
    container_name: fall_dashboard
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL:                 postgresql+psycopg2://fall_user:${POSTGRES_PASSWORD:-fall_pass}@postgres:5432/fall_detection
      MQTT_BROKER_HOST:             mqtt
      MQTT_BROKER_PORT:             "1883"
      MQTT_ALERT_TOPIC:             ${MQTT_ALERT_TOPIC:-fall/alert}
      MQTT_USERNAME:                ${MQTT_USERNAME:-}
      MQTT_PASSWORD:                ${MQTT_PASSWORD:-}
      CAREGIVER_HOST:               "0.0.0.0"
      CAREGIVER_PORT:               "8002"
      PATIENT_IDS:                  ${PATIENT_IDS:-}
      MAC_IDS:                      ${MAC_IDS:-}
      # FOCUS InfluxDB — for list_falls() (fall history tab in caregiver dashboard)
      INFLUXDB_URL:                 ${INFLUXDB_URL:-}
      INFLUXDB_TOKEN:               ${INFLUXDB_TOKEN:-}
      INFLUXDB_ORG:                 ${INFLUXDB_ORG:-}
      INFLUXDB_FALL_EVENTS_BUCKET:  ${INFLUXDB_FALL_EVENTS_BUCKET:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
    networks: [fall-net]

  ml-dashboard:
    build:
      context: ..
      dockerfile: ml_dashboard/Dockerfile
    image: fall-detection/ml-dashboard:latest
    container_name: fall_ml_dashboard
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      MLFLOW_TRACKING_URI:       http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL:    http://minio:9000
      AWS_ACCESS_KEY_ID:         ${MINIO_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY:     ${MINIO_PASSWORD:-minioadmin}
      MLFLOW_ARTIFACT_ROOT:      s3://mlflow-artifacts/
      MLFLOW_REGISTERED_MODEL:   ${MLFLOW_REGISTERED_MODEL:-fall-detection-xgboost}
      INFERENCE_SERVER_URL:      http://inference-server:8001
      INFERENCE_API_KEY:         ${API_KEYS}
      DATABASE_URL:              postgresql+psycopg2://fall_user:${POSTGRES_PASSWORD:-fall_pass}@postgres:5432/fall_detection
      MODEL_VERSION:             ${MODEL_VERSION:-v0}
      ACC_SENSOR_TYPE:           ${ACC_SENSOR_TYPE:-bosch}
      HARDWARE_ACC_SAMPLE_RATE:  ${HARDWARE_ACC_SAMPLE_RATE:-50}
      ML_DASHBOARD_HOST:         "0.0.0.0"
      ML_DASHBOARD_PORT:         "8004"
    depends_on:
      inference-server:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks: [fall-net]

  server-health:
    build:
      context: ..
      dockerfile: server_health/Dockerfile
    image: fall-detection/server-health:latest
    container_name: fall_server_health
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      INFERENCE_SERVER_URL:  http://inference-server:8001
      FALL_DASHBOARD_URL:    http://fall-dashboard:8002
      SERVER_HEALTH_HOST:    "0.0.0.0"
      SERVER_HEALTH_PORT:    "8006"
    depends_on:
      inference-server:
        condition: service_healthy
      fall-dashboard:
        condition: service_started
    networks: [fall-net]

  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: fall_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     fall_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fall_pass}
      POSTGRES_DB:       fall_detection
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fall_user -d fall_detection"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fall-net]

  mqtt:
    image: eclipse-mosquitto:2
    container_name: fall_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    networks: [fall-net]

  mlflow:
    build:
      context: ..
      dockerfile: infrastructure/mlflow/Dockerfile
    image: fall-detection/mlflow:latest
    container_name: fall_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID:      ${MINIO_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY:  ${MINIO_PASSWORD:-minioadmin}
    command: >
      server
      --backend-store-uri postgresql+psycopg2://fall_user:${POSTGRES_PASSWORD:-fall_pass}@postgres:5432/mlflow
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000
      --allowed-hosts mlflow:*,localhost:*,0.0.0.0:*,fall_mlflow:*
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    networks: [fall-net]

  minio:
    image: minio/minio:latest
    container_name: fall_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9002:9002"
    environment:
      MINIO_ROOT_USER:     ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [fall-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: fall_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    depends_on:
      inference-server:
        condition: service_healthy
    networks: [fall-net]

  grafana:
    image: grafana/grafana:10.4.0
    container_name: fall_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_AUTH_ANONYMOUS_ENABLED:  "false"
    volumes:
      - ../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - postgres
    networks: [fall-net]

# ── Networks + Volumes ────────────────────────────────────────────────────────

networks:
  fall-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  mqtt_data:
  mqtt_logs:
