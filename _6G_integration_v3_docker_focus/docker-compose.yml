# =============================================================================
# Fall Detection — Caregiver Layer (FOCUS mock environment)
# =============================================================================
#
# Represents the FOCUS-hosted services: MQTT broker and fall-dashboard.
#
# No local database. Patient list comes from PATIENT_IDS env var.
# InfluxDB is NOT hosted here — fall-dashboard connects to an external instance:
#   Local testing : MCS cloud InfluxDB (ecosystem-influxdb.smarko-health.de)
#   Production    : FOCUS's own InfluxDB already running in their k3s cluster
# Set INFLUXDB_* vars in .env to point at whichever instance is in use.
#
# For LOCAL TWO-LAPTOP TESTING run this on the second Windows laptop.
# For PRODUCTION this is what FOCUS DevOps hosts in their own environment
# (they will rebuild the Flutter dashboard on top of these APIs).
#
# Run from _6G_integration_v3_docker_focus/ as working directory:
#   docker compose --env-file .env up -d
#
# Services:
#   mock-app        :8005   Simulates the SmarKo mobile app (patient confirmation popup)
#   mqtt            :1883   MQTT broker — mobile app publishes fall alerts here
#   fall-dashboard  :8002   MQTT subscriber + SSE feed + /api/falls + /api/patients
# =============================================================================

services:

  # ── Mock mobile app ────────────────────────────────────────────────────────
  # Simulates the SmarKo mobile app running on the FOCUS network.
  # Fetches raw ACC data from MCS cloud InfluxDB, POSTs to inference-server
  # (Laptop 1), then on fall: MQTT publish + InfluxDB fall_events write + /confirm.
  # Patient confirmation popup available at http://localhost:8005/ in a browser.
  mock-app:
    build:
      context: .
      dockerfile: mock_app/Dockerfile
    image: fall-detection/mock-app:latest
    container_name: focus_mock_app
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      # ── Sensor data + fall events (MCS cloud InfluxDB for local testing)
      INFLUXDB_URL:                  ${INFLUXDB_URL}
      INFLUXDB_TOKEN:                ${INFLUXDB_TOKEN}
      INFLUXDB_ORG:                  ${INFLUXDB_ORG}
      INFLUXDB_BUCKET:               ${INFLUXDB_BUCKET}
      INFLUXDB_FALL_EVENTS_BUCKET:   ${INFLUXDB_FALL_EVENTS_BUCKET}
      BAROMETER_FIELD:               ${BAROMETER_FIELD:-bmp_pressure}
      # ── Inference server on MCS Laptop 1 — set to Laptop 1 IP
      INFERENCE_SERVER_URL:          ${INFERENCE_SERVER_URL}
      INFERENCE_API_KEY:             ${INFERENCE_API_KEY}
      # ── MQTT broker on same machine (Docker service name)
      MQTT_BROKER_HOST:              mqtt
      MQTT_BROKER_PORT:              "1883"
      MQTT_ALERT_TOPIC:              ${MQTT_ALERT_TOPIC:-fall/alert}
      MQTT_POSSIBLE_TOPIC:           ${MQTT_POSSIBLE_TOPIC:-fall/possible}
      MQTT_USERNAME:                 ${MQTT_USERNAME:-}
      MQTT_PASSWORD:                 ${MQTT_PASSWORD:-}
      # ── Patients + hardware
      PATIENT_IDS:                   ${PATIENT_IDS:-}
      MAC_IDS:                       ${MAC_IDS:-}
      ACC_SENSOR_TYPE:               ${ACC_SENSOR_TYPE:-bosch}
      HARDWARE_ACC_SAMPLE_RATE:      ${HARDWARE_ACC_SAMPLE_RATE:-50}
      RESAMPLING_METHOD:             ${RESAMPLING_METHOD:-linear}
      # ── Polling behaviour
      POLL_INTERVAL_SECONDS:         ${POLL_INTERVAL_SECONDS:-10}
      POLL_LOOKBACK_SECONDS:         ${POLL_LOOKBACK_SECONDS:-15}
      MOCK_PATIENT_RESPONSE_TIMEOUT: ${MOCK_PATIENT_RESPONSE_TIMEOUT:-1}
      MOCK_PATIENT_SERVER_PORT:      "8005"
      LOG_LEVEL:                     ${LOG_LEVEL:-INFO}
    depends_on:
      mqtt:
        condition: service_started
    networks: [caregiver-net]

  # ── MQTT broker ────────────────────────────────────────────────────────────
  # Mobile app (Isa) publishes fall/alert/<patient_id> here after confirmation.
  # fall-dashboard subscribes to fall/alert/# and fans out via SSE.
  # Reachable from outside Docker at <this-machine-ip>:1883
  mqtt:
    image: eclipse-mosquitto:2
    container_name: focus_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    networks: [caregiver-net]

  # ── Fall dashboard ─────────────────────────────────────────────────────────
  # Subscribes to MQTT broker, serves SSE feed and REST API for caregiver UI.
  # FOCUS Flutter dashboard connects to:
  #   GET  /api/stream          SSE live fall alerts
  #   GET  /api/falls           Fall history (queried from external InfluxDB)
  #   GET  /api/patients        Patient list (from PATIENT_IDS env var + InfluxDB fall counts)
  fall-dashboard:
    build:
      context: .
      dockerfile: fall_dashboard/Dockerfile
    image: fall-detection/fall-dashboard:latest
    container_name: focus_fall_dashboard
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      MQTT_BROKER_HOST:            mqtt
      MQTT_BROKER_PORT:            "1883"
      MQTT_ALERT_TOPIC:            ${MQTT_ALERT_TOPIC:-fall/alert}
      MQTT_POSSIBLE_TOPIC:         ${MQTT_POSSIBLE_TOPIC:-fall/possible}
      MQTT_USERNAME:               ${MQTT_USERNAME:-}
      MQTT_PASSWORD:               ${MQTT_PASSWORD:-}
      CAREGIVER_HOST:              "0.0.0.0"
      CAREGIVER_PORT:              "8002"
      PATIENT_IDS:                 ${PATIENT_IDS:-}
      MAC_IDS:                     ${MAC_IDS:-}
      # SQLite patient store (replaces Postgres participant_session).
      # Lives on the patient_db named volume so it survives container recreate.
      PATIENT_DB_PATH:             /app/data/patients.db
      # InfluxDB — external instance (MCS cloud for testing / FOCUS k3s for production)
      INFLUXDB_URL:                ${INFLUXDB_URL}
      INFLUXDB_TOKEN:              ${INFLUXDB_TOKEN}
      INFLUXDB_ORG:                ${INFLUXDB_ORG}
      INFLUXDB_FALL_EVENTS_BUCKET: ${INFLUXDB_FALL_EVENTS_BUCKET}
    volumes:
      - patient_db:/app/data
    depends_on:
      mqtt:
        condition: service_started
    networks: [caregiver-net]

# ── Networks + Volumes ────────────────────────────────────────────────────────

networks:
  caregiver-net:
    driver: bridge

volumes:
  mqtt_data:
  mqtt_logs:
  patient_db:    # SQLite patient store for the fall-dashboard
