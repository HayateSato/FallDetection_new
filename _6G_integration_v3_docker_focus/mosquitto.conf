# eclipse-mosquitto — caregiver layer (local testing, no auth)
# Same as deploy/mosquitto.conf — enable auth when moving to production.

# Apply auth to all listeners (mosquitto 2.x default is per-listener)
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd

# Internal TCP — fall-dashboard and mock-app connect here via Docker network
listener 1883

# External WebSocket — mobile app (Isa) connects here from outside Docker
# Docker: ws://<host-ip>:9001
# K3s:   wss://<ingress-host>:443 (Traefik terminates TLS and forwards to this port)
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
